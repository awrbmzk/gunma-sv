<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4efe3">
<title>群馬SV空白マップ</title>
<style>
  :root {
    --paper: #f4efe3;
    --surface: #fffdf7;
    --surface-2: #f6f1e5;
    --line: #d3c8b0;
    --line-soft: #e6ddca;
    --ink: #221e17;
    --muted: #6d6353;
    --ai: #22527d;
    --verm: #b8462c;
    --amber: #c98a1e;
    --gold: #d8b44a;
    --grey: #8d8474;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  #map { position: absolute; inset: 0; background: #e8e0cc; }

  /* ---- 上部バー ---- */
  .topbar {
    position: absolute;
    top: calc(var(--sat) + 8px);
    left: 8px;
    right: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
    pointer-events: none;
    z-index: 5;
  }

  .pill {
    pointer-events: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: 0 2px 10px -4px rgba(34, 30, 23, .5);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .pill b { font-size: 15px; }
  .pill .rest b { color: var(--verm); }
  .pill .gone b { color: var(--ai); }
  .pill .sep { width: 1px; height: 16px; background: var(--line); }

  .iconbtn {
    pointer-events: auto;
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px -4px rgba(34, 30, 23, .5);
    font-size: 19px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
  }

  .iconbtn.on { background: var(--ai); color: #fff; border-color: var(--ai); }

  /* ---- 右下の丸ボタン ---- */
  .fabs {
    position: absolute;
    right: 10px;
    bottom: calc(var(--sab) + 150px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 6;
  }

  .fab {
    width: 52px;
    height: 52px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 3px 14px -5px rgba(34, 30, 23, .6);
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .fab.on { background: var(--verm); color: #fff; border-color: var(--verm); }
  .fab.loc.on { background: var(--ai); border-color: var(--ai); }

  #rectbox {
    position: fixed;
    border: 2px dashed var(--verm);
    background: rgba(184, 70, 44, .12);
    pointer-events: none;
    z-index: 9;
  }

  #rectbox b {
    position: absolute;
    left: 0;
    top: -26px;
    background: var(--verm);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .rectmode #map { cursor: crosshair; touch-action: none; }

  /* ---- 選択した道の操作バー ---- */
  .action {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: calc(var(--sab) + 96px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 6px 24px -8px rgba(34, 30, 23, .55);
    padding: 12px 14px;
    z-index: 7;
  }

  .action .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .action .ttl { font-weight: 600; }
  .action .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .action .x { font-size: 20px; color: var(--muted); padding: 0 4px; cursor: pointer; }
  .action .row { display: flex; gap: 8px; margin-top: 10px; }

  .bigbtn {
    flex: 1 1 0;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 10px;
    border-radius: 10px;
    border: 1px solid var(--ai);
    background: var(--ai);
    color: #fff;
    cursor: pointer;
  }

  .bigbtn.ghost { background: var(--surface-2); color: var(--ink); border-color: var(--line); font-weight: 500; }
  .bigbtn.undoish { background: var(--surface-2); color: var(--verm); border-color: var(--verm); }

  /* ---- 下のシート ---- */
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px -10px rgba(34, 30, 23, .5);
    z-index: 8;
    transition: transform .22s ease;
    max-height: 78vh;
    display: flex;
    flex-direction: column;
    padding-bottom: var(--sab);
  }

  .sheet.closed { transform: translateY(calc(100% - 84px - var(--sab))); }

  .grip { padding: 8px 0 4px; display: flex; justify-content: center; cursor: pointer; flex: none; }
  .grip i { width: 38px; height: 4px; border-radius: 2px; background: var(--line); display: block; }

  .tabs { display: flex; gap: 6px; padding: 0 12px 8px; flex: none; }

  .tab {
    flex: 1 1 0;
    text-align: center;
    padding: 9px 6px;
    border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13.5px;
    cursor: pointer;
  }

  .tab.on { background: var(--ai); color: #fff; border-color: var(--ai); font-weight: 600; }

  .pane { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 16px; }
  .pane[hidden] { display: none; }

  .row2 { padding: 11px 14px; border-top: 1px solid var(--line-soft); display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .row2:active { background: var(--surface-2); }
  .row2 .dist { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ai); font-weight: 600; min-width: 62px; }
  .row2 .mid { flex: 1 1 auto; min-width: 0; }
  .row2 .nm { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row2 .sub { font-size: 12px; color: var(--muted); }
  .row2 .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .chip.c0 { color: var(--verm); border-color: var(--verm); }
  .chip.c1 { color: var(--amber); border-color: var(--amber); }
  .chip.c2 { color: var(--gold); border-color: var(--gold); }

  .set { padding: 12px 14px; border-top: 1px solid var(--line-soft); }
  .set h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 600; }

  .sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; cursor: pointer; }
  .sw span { font-size: 14px; }
  .sw input { width: 22px; height: 22px; accent-color: var(--ai); margin: 0; }

  .set select, .set input[type=range] {
    width: 100%;
    font: inherit;
    font-size: 15px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    color: inherit;
  }

  .set input[type=range] { padding: 0; accent-color: var(--ai); }
  .set label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .btnrow { display: flex; gap: 8px; margin-top: 12px; }

  .note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .warn { color: var(--verm); }

  /* ---- 起動画面 ---- */
  .gate {
    position: absolute;
    inset: 0;
    background: var(--paper);
    z-index: 20;
    overflow-y: auto;
    padding: calc(var(--sat) + 28px) 22px calc(var(--sab) + 28px);
  }

  .gate h1 { font-size: 21px; margin: 0 0 6px; }
  .gate p { font-size: 14px; color: var(--muted); }

  .gate input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px;
    margin-top: 6px;
  }

  .gate .go { width: 100%; margin-top: 14px; }
  .prog { margin-top: 18px; font-size: 13px; color: var(--ai); font-variant-numeric: tabular-nums; }
  .err { color: var(--verm); font-size: 13.5px; margin-top: 12px; white-space: pre-wrap; }

  .legend {
    position: absolute;
    left: 8px;
    bottom: calc(var(--sab) + 96px);
    background: rgba(255, 253, 247, .92);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 11px;
    color: var(--muted);
    z-index: 4;
    display: flex;
    gap: 9px;
  }

  .legend span { display: flex; align-items: center; gap: 4px; }
  .legend i { width: 13px; height: 3px; border-radius: 2px; display: block; }

  @media (min-width: 820px) {
    .sheet { left: auto; right: 0; top: 0; bottom: 0; width: 380px; max-height: none; border-radius: 0; border-left: 1px solid var(--line); transform: none !important; }
    .sheet.closed { transform: none; }
    .grip { display: none; }
    .topbar { right: 400px; }
    .fabs { right: 400px; bottom: 30px; }
    .action { right: 400px; bottom: 30px; left: 20px; max-width: 420px; }
    .legend { bottom: 30px; }
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="topbar" id="topbar" hidden>
  <div class="pill">
    <span class="rest">残り <b id="pRest">–</b></span>
    <span class="sep"></span>
    <span class="gone">消 <b id="pGone">–</b></span>
  </div>
  <div style="flex:1 1 auto"></div>
  <div class="iconbtn" id="btnSv" title="Googleの青い線">◎</div>
</div>

<div class="fabs" id="fabs" hidden>
  <div class="fab loc" id="btnLoc" title="現在地">➤</div>
  <div class="fab" id="btnRect" title="四角く囲って消す">▭</div>
  <div class="fab" id="btnEraser" title="消しゴムモード">✕</div>
</div>

<div id="rectbox" hidden><b id="rectn"></b></div>

<div class="legend" id="legend" hidden>
  <span><i style="background:#b8462c"></i>0%</span>
  <span><i style="background:#c98a1e"></i>〜29%</span>
  <span><i style="background:#d8b44a"></i>〜59%</span>
</div>

<div class="action" id="action" hidden>
  <div class="hd">
    <div>
      <div class="ttl" id="aTtl">—</div>
      <div class="sub" id="aSub">—</div>
    </div>
    <div class="x" id="aClose">×</div>
  </div>
  <div class="row">
    <button class="bigbtn" id="aDone">行った（消す）</button>
    <button class="bigbtn ghost" id="aSv">SVを開く</button>
  </div>
</div>

<div class="sheet closed" id="sheet" hidden>
  <div class="grip" id="grip"><i></i></div>
  <div class="tabs" id="tabsBar">
    <div class="tab on" data-p="near">近くの道</div>
    <div class="tab" data-p="filter">絞り込み</div>
    <div class="tab" data-p="prog">進捗</div>
  </div>
  <div class="pane" id="pNear"></div>
  <div class="pane" id="pFilter" hidden>
    <div class="set">
      <h3>表示する種類</h3>
      <label class="sw"><span style="color:#b8462c">■ 公式SVなし（0%）</span><input type="checkbox" class="cov" value="0" checked></label>
      <label class="sw"><span style="color:#c98a1e">■ ごく一部だけ（〜29%）</span><input type="checkbox" class="cov" value="1" checked></label>
      <label class="sw"><span style="color:#d8b44a">■ 半分未満（〜59%）</span><input type="checkbox" class="cov" value="2"></label>
      <label class="f">最小の長さ　<b id="lenLbl">0 m</b></label>
      <input type="range" id="flen" min="0" max="500" step="25" value="0">
      <label class="f">道路分類</label>
      <select id="fctg"></select>
      <label class="f">市町村</label>
      <select id="fmuni"></select>
      <label class="sw" style="margin-top:6px"><span>消した道も薄く表示</span><input type="checkbox" id="showdone"></label>
      <label class="sw"><span>Googleの青い線（公式SVの範囲）</span><input type="checkbox" id="svchk"></label>
    </div>
  </div>
  <div class="pane" id="pProg" hidden>
    <div class="set">
      <h3>この端末の記録</h3>
      <div style="font-size:14px">消した道 <b id="gN">0</b> 本 ／ <b id="gKm">0</b> km<br>残り <b id="gRest">0</b> 本</div>
      <div class="btnrow">
        <button class="bigbtn ghost" id="btnScreen">画面内をまとめて消す</button>
      </div>
      <div class="btnrow">
        <button class="bigbtn undoish" id="btnUndo">取り消し</button>
      </div>
      <h3 style="margin-top:20px">PCと同期</h3>
      <div id="syncBox"></div>

      <h3 style="margin-top:20px">バックアップ</h3>
      <p class="note" style="margin-top:0">同期を使わない場合、記録はこの端末だけに残ります。書き出したファイルを他の端末で読み込めば引き継げます。</p>
      <div class="btnrow">
        <button class="bigbtn ghost" id="btnExp">書き出す</button>
        <button class="bigbtn ghost" id="btnImp">読み込む</button>
      </div>
      <input type="file" id="impFile" accept=".json" hidden>
      <p class="note" id="progNote"></p>
    </div>
  </div>
</div>

<div class="gate" id="gate">
  <h1>群馬SV空白マップ</h1>
  <p>公式ストリートビューが無い道を地図に出して、行ったところを消していくためのページです。</p>
  <div id="gKey">
    <label class="f" style="font-size:13px;color:var(--muted)">Google Maps APIキー</label>
    <input type="password" id="key" placeholder="AIza…" autocomplete="off" inputmode="text">
    <p class="note">このブラウザにだけ保存されます。キーには Maps JavaScript API の権限が必要です。</p>
    <button class="bigbtn go" id="btnStart">はじめる</button>
  </div>
  <div class="prog" id="gProg"></div>
  <div class="err" id="gErr"></div>
</div>

<script>
(function () {
  "use strict";
  var KKEY = "sv-key", DKEY = "sv-done-v1", SVKEY = "sv-layer-on", HEAVY = "sv-load-heavy", VKEY = "sv-view", MKEY = "sv-marks-v2", SKEY = "sv-sync";
  var DATA_URL = "gunma_sv_mobile.json";
  var map, svLayer, meMarker, meCircle, sel = null;
  var roads = [], grid = {}, GS = 0.02;
  var done = {}, doneN = 0, undoStack = [];
  var pool = [], drawn = [], inView = [];
  var follow = false, eraser = false, myPos = null, watchId = null;
  var lastSwipe = 0;
  var CAP = 1400;
  var D = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function num(n) { return n.toLocaleString("ja-JP"); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  // ---------- 起動 ----------
  var savedKey = lsGet(KKEY);
  if (savedKey) $("key").value = savedKey;
  $("btnStart").addEventListener("click", start);
  $("key").addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });

  function start() {
    var k = $("key").value.trim();
    if (!k) { $("gErr").textContent = "キーを入れてください。"; return; }
    lsSet(KKEY, k);
    $("gKey").hidden = true;
    $("gErr").textContent = "";
    loadData().then(function () { return loadMaps(k); }).catch(function (e) {
      $("gErr").textContent = String(e && e.message || e);
      $("gKey").hidden = false;
    });
  }

  function loadData() {
    $("gProg").textContent = "地図データを読み込んでいます…";
    return fetch(DATA_URL, { cache: "force-cache" }).then(function (r) {
      if (!r.ok) throw new Error("データが見つかりません（" + DATA_URL + " / HTTP " + r.status + "）");
      return r.json();
    }).then(function (j) {
      D = j;
      var heavy = lsGet(HEAVY) === "1";
      var n = 0;
      j.roads.forEach(function (r) {
        var cov = r[0] / 1000;
        var bnd = cov === 0 ? 0 : (cov < 0.3 ? 1 : 2);
        if (bnd === 2 && !heavy) return;
        var g = r[5], pts = new Array(g.length / 2);
        var x = g[0], y = g[1];
        pts[0] = [x / 1e5, y / 1e5];
        var s = y, w = x, nn = y, e = x;
        for (var i = 2, k = 1; i < g.length; i += 2, k++) {
          x += g[i]; y += g[i + 1];
          pts[k] = [x / 1e5, y / 1e5];
          if (y < s) s = y; if (y > nn) nn = y;
          if (x < w) w = x; if (x > e) e = x;
        }
        var o = { cov: cov, band: bnd, len: r[1], ms: r[2], ctg: r[3], wd: r[4], pts: pts,
                  b: [s / 1e5, w / 1e5, nn / 1e5, e / 1e5] };
        o.id = roadId(o);
        roads.push(o);
        n++;
      });
      $("gProg").textContent = num(n) + " 本を読み込みました。地図を準備しています…";
      index();
    });
  }

  function roadId(o) {
    var a = o.pts[0], b = o.pts[o.pts.length - 1];
    var s = a[0] + "," + a[1] + "|" + b[0] + "," + b[1] + "|" + o.len;
    var h1 = 2166136261, h2 = 5381;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      h1 = (h1 ^ c) >>> 0;
      h1 = (h1 + ((h1 << 1) + (h1 << 4) + (h1 << 7) + (h1 << 8) + (h1 << 24))) >>> 0;
      h2 = (((h2 << 5) + h2) + c) >>> 0;
    }
    return h1.toString(36) + "-" + h2.toString(36);
  }

  function index() {
    roads.forEach(function (o, idx) {
      for (var y = Math.floor(o.b[0] / GS); y <= Math.floor(o.b[2] / GS); y++) {
        for (var x = Math.floor(o.b[1] / GS); x <= Math.floor(o.b[3] / GS); x++) {
          var k = y + ":" + x;
          (grid[k] = grid[k] || []).push(idx);
        }
      }
    });
  }

  var diagShown = false;
  var origError = console.error;
  console.error = function () {
    var s = Array.prototype.map.call(arguments, String).join(" ");
    var m = /Google Maps JavaScript API (?:error|warning):\s*(\w+)/.exec(s);
    if (m && !diagShown) {
      diagShown = true;
      $("gErr").textContent = "Googleがキーを受け付けませんでした：" + m[1] +
        "\n・Maps JavaScript API が有効か\n・キーの「APIの制限」に入っているか\n" +
        "・「ウェブサイトの制限」にこのページのURLが入っているか\nを確認してください。";
      $("gKey").hidden = false;
    }
    origError.apply(console, arguments);
  };

  function loadMaps(k) {
    return new Promise(function (resolve, reject) {
      window.__ready = function () { init(); resolve(); };
      window.gm_authFailure = function () {
        setTimeout(function () {
          if (!diagShown) {
            $("gErr").textContent = "キーが拒否されました。制限設定を確認してください。";
            $("gKey").hidden = false;
          }
        }, 400);
      };
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(k) +
        "&v=weekly&language=ja&region=JP&callback=__ready";
      s.onerror = function () { reject(new Error("Googleマップを読み込めませんでした。")); };
      document.head.appendChild(s);
    });
  }

  // ---------- 地図 ----------
  var COLORS = ["#b8462c", "#c98a1e", "#d8b44a"], DONE_C = "#8d8474";

  function init() {
    loadDone();
    loadSync();
    var v = (lsGet(VKEY) || "").split(",");
    var c0 = (v.length === 3 && isFinite(v[0])) ? { lat: +v[0], lng: +v[1] } : { lat: 36.39, lng: 139.06 };
    var z0 = (v.length === 3 && isFinite(v[2])) ? +v[2] : 11;
    map = new google.maps.Map($("map"), {
      center: c0, zoom: z0,
      mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
      zoomControl: false, clickableIcons: false, gestureHandling: "greedy",
      isFractionalZoomEnabled: true
    });
    svLayer = new google.maps.StreetViewCoverageLayer();
    setSvLayer(lsGet(SVKEY) !== "0");

    map.addListener("idle", function () {
      draw();
      renderNear();
      var c = map.getCenter();

  // ---------- ダブルタップ＋上下スライドでズーム ----------
  function setupDoubleTapZoom() {
    var el = $("map");
    var lastTapT = 0, lastTapX = 0, lastTapY = 0;
    var active = false, startY = 0, startZoom = 0, moved = false;
    var anchorWorld = null, offX = 0, offY = 0;

    function worldOf(latLng) { return map.getProjection().fromLatLngToPoint(latLng); }

    function beginAt(x, y) {
      var proj = map.getProjection();
      if (!proj) return false;
      var r = el.getBoundingClientRect();
      offX = x - r.left - r.width / 2;
      offY = y - r.top - r.height / 2;
      startZoom = map.getZoom();
      var scale = Math.pow(2, startZoom);
      var cw = worldOf(map.getCenter());
      anchorWorld = new google.maps.Point(cw.x + offX / scale, cw.y + offY / scale);
      return true;
    }

    function applyZoom(z) {
      z = Math.max(3, Math.min(20, z));
      var scale = Math.pow(2, z);
      var center = map.getProjection().fromPointToLatLng(
        new google.maps.Point(anchorWorld.x - offX / scale, anchorWorld.y - offY / scale));
      map.setZoom(z);
      map.setCenter(center);
    }

    el.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { active = false; return; }
      var t = e.touches[0], now = Date.now();
      var isDouble = (now - lastTapT < 320) &&
        Math.abs(t.clientX - lastTapX) < 34 && Math.abs(t.clientY - lastTapY) < 34;
      lastTapT = now; lastTapX = t.clientX; lastTapY = t.clientY;
      if (!isDouble) return;
      if (!beginAt(t.clientX, t.clientY)) return;
      active = true;
      moved = false;
      startY = t.clientY;
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false, capture: true });

    el.addEventListener("touchmove", function (e) {
      if (!active) return;
      e.preventDefault();
      e.stopPropagation();
      var dy = startY - e.touches[0].clientY;
      if (Math.abs(dy) > 6) moved = true;
      applyZoom(startZoom + dy * 0.014);
    }, { passive: false, capture: true });

    function end(e) {
      if (!active) return;
      active = false;
      if (!moved) applyZoom(startZoom + 1);   // 動かさなければ普通のダブルタップ拡大
      lastTapT = 0;
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }
    el.addEventListener("touchend", end, { passive: false, capture: true });
    el.addEventListener("touchcancel", end, { passive: false, capture: true });
  }

  // ---------- 下のシートをスワイプで出し入れ ----------
  function setupSheetSwipe() {
    var sheet = $("sheet");
    var startY = 0, base = 0, cur = 0, dragging = false, movedPx = 0, maxY = 0, fromGrip = false;

    function curTranslate() {
      var t = getComputedStyle(sheet).transform;
      if (!t || t === "none") return 0;
      var m = /matrix\((?:[^,]+,){5}\s*([-\d.]+)\)/.exec(t);
      return m ? parseFloat(m[1]) : 0;
    }

    function hiddenPart() {
      var sab = parseFloat(getComputedStyle(sheet).paddingBottom) || 0;
      return Math.max(40, sheet.getBoundingClientRect().height - 84 - sab);
    }

    function onStart(e) {
      if (e.touches.length !== 1) return;
      fromGrip = this.id === "grip";
      base = curTranslate();
      maxY = sheet.classList.contains("closed") ? Math.max(base, hiddenPart()) : hiddenPart();
      startY = e.touches[0].clientY;
      cur = base;
      movedPx = 0;
      dragging = true;
      sheet.style.transition = "none";
    }

    function onMove(e) {
      if (!dragging) return;
      var dy = e.touches[0].clientY - startY;
      movedPx = Math.abs(dy);
      if (movedPx < 4) return;
      cur = Math.max(0, Math.min(maxY, base + dy));
      sheet.style.transform = "translateY(" + cur + "px)";
      if (e.cancelable) e.preventDefault();
    }

    function onEnd() {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (movedPx < 8) {
        // ほぼ動いていない＝タップ。グリップなら開閉、タブ類はそのままタブ切替に任せる
        if (fromGrip) { lastSwipe = Date.now(); toggleSheet(); }
        return;
      }
      lastSwipe = Date.now();
      // 50px以上動かしたら指の向きで決める。それ未満は元の状態に戻す
      var dy = cur - base;
      if (Math.abs(dy) > 50) sheet.classList.toggle("closed", dy > 0);
      else sheet.classList.toggle("closed", base > maxY / 2);
    }

    ["grip", "tabsBar"].forEach(function (id) {
      var h = $(id);
      if (!h) return;
      h.addEventListener("touchstart", onStart, { passive: true });
      h.addEventListener("touchmove", onMove, { passive: false });
      h.addEventListener("touchend", onEnd, { passive: true });
      h.addEventListener("touchcancel", onEnd, { passive: true });
    });
  }

  // 青い線（公式SV範囲）のオン・オフ。上の◎ボタンと絞り込みのチェックの両方から切り替える
  function setSvLayer(on) {
    if (svLayer) svLayer.setMap(on ? map : null);
    var b = $("btnSv"), c = $("svchk");
    if (b) b.classList.toggle("on", on);
    if (c) c.checked = on;
    lsSet(SVKEY, on ? "1" : "0");
  }

  function fillSelect(id, arr, all) {    $(id).innerHTML = '<option value="">' + all + "</option>" +
      arr.map(function (v, i) { return '<option value="' + i + '">' + esc(v) + "</option>"; }).join("");
  }

  // ---------- 記録（id → 時刻。正=行った、負=戻した） ----------
  function isDone(id) { return done[id] > 0; }

  // 「消した本数」は読み込んである道の本数で数える（残り＋消＝総数 になるように）
  function countDone() {
    var n = 0;
    if (!roads.length) { for (var k in done) if (done[k] > 0) n++; return n; }
    for (var i = 0; i < roads.length; i++) if (done[roads[i].id] > 0) n++;
    return n;
  }

  function loadDone() {
    done = {};
    var raw = lsGet(MKEY);
    if (raw) { try { done = JSON.parse(raw) || {}; } catch (e) { done = {}; } }
    else {
      var old = lsGet(DKEY);   // 旧形式からの引き継ぎ
      if (old) old.split("\n").forEach(function (id) { if (id) done[id] = 1; });
    }
    doneN = countDone();
  }

  var st = null;
  function saveDone() {
    clearTimeout(st);
    st = setTimeout(function () {
      if (!lsSet(MKEY, JSON.stringify(done))) {
        $("progNote").innerHTML = '<span class="warn">保存できませんでした。書き出してバックアップしてください。</span>';
      }
    }, 350);
  }

  function mark(ids, v) {
    var ch = [], t = Date.now(), patch = {};
    ids.forEach(function (id) {
      if (v === isDone(id)) return;
      done[id] = v ? t : -t;
      patch[id] = done[id];
      ch.push(id);
    });
    if (!ch.length) return;
    doneN = countDone();
    undoStack.push({ ids: ch, v: v });
    if (undoStack.length > 30) undoStack.shift();
    saveDone();
    syncPush();
    refresh();
  }

  function undo() {
    var l = undoStack.pop();
    if (!l) { alert("戻せる操作がありません。"); return; }
    var t = Date.now(), patch = {};
    l.ids.forEach(function (id) { done[id] = l.v ? -t : t; patch[id] = done[id]; });
    doneN = countDone();
    saveDone();
    syncPush();
    refresh();
  }

  function exportDone() {
    var blob = new Blob([JSON.stringify({ app: "gunma-sv-done", v: 2, savedAt: new Date().toISOString(),
      marks: done, ids: Object.keys(done).filter(isDone) })], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sv-done.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  }

  function importDone() {
    var f = this.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var j = JSON.parse(fr.result);
        var before = doneN;
        if (j.marks) { mergeMarks(j.marks); saveDone(); syncPush(); refresh(); }
        else { mark((j.ids || []).filter(function (id) { return !isDone(id); }), true); }
        $("progNote").textContent = num(Math.max(0, doneN - before)) + " 本を追加しました（合計 " + num(doneN) + " 本）。";
      } catch (e) { $("progNote").innerHTML = '<span class="warn">読み込めませんでした。</span>'; }
    };
    fr.readAsText(f);
    this.value = "";
  }

  // 同じidは「新しい時刻のほう」を採用して混ぜる
  function mergeMarks(remote) {
    var changed = 0;
    for (var id in remote) {
      var r = remote[id], l = done[id];
      if (l === undefined || Math.abs(r) > Math.abs(l)) { done[id] = r; changed++; }
    }
    if (changed) doneN = countDone();
    return changed;
  }

  // ---------- 端末間の同期（GitHubのGistに保存） ----------
  var sync = null, pushTimer = null, pollTimer = null, syncing = false, dirty = false;
  var GFILE = "sv-done.json";

  function loadSync() {
    var q = /[?&]sync=([^&]+)/.exec(location.search);
    if (q) {
      try {
        var cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(q[1])))));
        if (cfg.t && cfg.g) lsSet(SKEY, JSON.stringify(cfg));
      } catch (e) { /* 壊れたリンクは無視 */ }
      if (history.replaceState) history.replaceState(null, "", location.pathname);
    }
    var raw = lsGet(SKEY);
    if (raw) { try { sync = JSON.parse(raw); } catch (e) { sync = null; } }
  }

  function syncStatus(txt, bad) {
    var el = $("syncState");
    if (el) el.innerHTML = bad ? '<span class="warn">' + esc(txt) + "</span>" : esc(txt);
  }

  function nowHM() {
    return new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  }

  function ghHeaders() {
    return { "Authorization": "Bearer " + sync.t, "Accept": "application/vnd.github+json",
             "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" };
  }

  function toB64(bytes) {
    var s = "", CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  }

  function fromB64(str) {
    var bin = atob(str.replace(/\s/g, ""));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // 件数が増えても軽いよう、使えるブラウザでは圧縮して置く
  function encodeMarks() {
    var s = JSON.stringify({ v: 2, updated: new Date().toISOString(), marks: done });
    if (!window.CompressionStream) return Promise.resolve(s);
    return new Response(new Blob([s]).stream().pipeThrough(new CompressionStream("gzip")))
      .arrayBuffer().then(function (buf) { return "GZ1:" + toB64(new Uint8Array(buf)); });
  }

  function decodeMarks(text) {
    if (text.slice(0, 4) !== "GZ1:") return Promise.resolve(JSON.parse(text));
    if (!window.DecompressionStream) return Promise.reject(new Error("このブラウザでは展開できません"));
    var bytes = fromB64(text.slice(4));
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip")))
      .text().then(function (t) { return JSON.parse(t); });
  }

  function createGist() {
    syncStatus("保存場所を作成中…");
    return encodeMarks().then(function (content) {
      var files = {};
      files[GFILE] = { content: content };
      return fetch("https://api.github.com/gists", { method: "POST", headers: ghHeaders(),
        body: JSON.stringify({ description: "群馬SV空白マップ 進捗", public: false, files: files }) });
    }).then(function (r) {
      if (r.status === 401 || r.status === 403) throw new Error("トークンが拒否されました（" + r.status + "）。Gistsの書き込み権限を確認してください");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) {
      sync.g = j.id;
      lsSet(SKEY, JSON.stringify(sync));
      dirty = false;
      syncStatus("保存しました " + nowHM());
      renderSyncUI();
      syncStart();
    }).catch(function (e) { syncStatus(String(e && e.message || e), true); });
  }

  function syncPull(quiet) {
    if (!sync || !sync.g || syncing) return Promise.resolve(0);
    syncing = true;
    if (!quiet) syncStatus("同期中…");
    return fetch("https://api.github.com/gists/" + sync.g + "?t=" + Date.now(),
      { headers: ghHeaders(), cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) throw new Error("保存場所が見つかりません（削除された可能性）");
        if (r.status === 401 || r.status === 403) throw new Error("トークンが拒否されました（" + r.status + "）");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        var f = j.files && j.files[GFILE];
        if (!f) { syncStatus("保存場所は空です（" + nowHM() + "）"); return 0; }
        var get = f.truncated && f.raw_url
          ? fetch(f.raw_url, { headers: { "Authorization": "Bearer " + sync.t } }).then(function (r) { return r.text(); })
          : Promise.resolve(f.content);
        return get.then(decodeMarks).then(function (obj) {
          var ch = obj && obj.marks ? mergeMarks(obj.marks) : 0;
          if (ch) { saveDone(); afterSync(); }
          syncStatus("最終同期 " + nowHM() + (ch ? "（" + num(ch) + "件 受信）" : ""));
          return ch;
        });
      })
      .catch(function (e) { syncStatus(String(e && e.message || e), true); return 0; })
      .then(function (n) { syncing = false; return n; });
  }

  function syncPush() {
    if (!sync) return;
    dirty = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(doPush, 3000);
  }

  function doPush() {
    if (!sync || !sync.g || !dirty) return;
    syncStatus("保存中…");
    syncPull(true).then(encodeMarks).then(function (content) {   // 相手の変更を取り込んでから書き戻す
      var files = {};
      files[GFILE] = { content: content };
      return fetch("https://api.github.com/gists/" + sync.g,
        { method: "PATCH", headers: ghHeaders(), body: JSON.stringify({ files: files }) });
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      dirty = false;
      syncStatus("保存しました " + nowHM());
    }).catch(function (e) { syncStatus(String(e && e.message || e), true); });
  }

  function syncStart() {
    if (!sync || !sync.g) return;
    syncPull();
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (document.visibilityState === "visible" && !dirty) syncPull(true);
    }, 60000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && !dirty) syncPull(true);
    });
    window.addEventListener("beforeunload", function () {
      if (dirty) { clearTimeout(pushTimer); doPush(); }
    });
  }

  function renderSyncUI() {
    var box = $("syncBox");
    if (!box) return;
    var inp = 'style="width:100%;font:inherit;font-size:15px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:4px"';
    if (!sync || !sync.g) {
      box.innerHTML =
        '<p class="note" style="margin-top:0">GitHubの「Gist」に記録を置いて、PCとスマホで共有します。必要なのはトークン1つだけです。</p>' +
        '<label class="f">GitHubのアクセストークン</label>' +
        '<input id="ghT" type="password" ' + inp + ' placeholder="github_pat_…" autocapitalize="off" autocomplete="off">' +
        '<div class="btnrow"><button class="bigbtn" id="syncOn">同期を始める</button></div>' +
        '<div id="syncState" style="font-size:13px;margin-top:8px"></div>' +
        '<p class="note">2台目は、1台目で作る「同期リンク」を開くだけです。</p>';
      $("syncOn").addEventListener("click", function () {
        var t = ($("ghT").value || "").trim();
        if (!t) { alert("トークンを入力してください。"); return; }
        sync = { t: t, g: "" };
        createGist();
      });
      return;
    }
    box.innerHTML =
      '<div style="font-size:13.5px">状態：<span id="syncState">接続中…</span></div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all">Gist: ' + esc(sync.g) + "</div>" +
      '<div class="btnrow"><button class="bigbtn ghost" id="syncLink">同期リンクをコピー</button>' +
      '<button class="bigbtn ghost" id="syncNow">今すぐ同期</button></div>' +
      '<div class="btnrow"><button class="bigbtn undoish" id="syncOff">同期を解除</button></div>' +
      '<p class="note" id="syncNote">同期リンクにはトークンが入っています。他人に渡さないでください。</p>';
    $("syncNow").addEventListener("click", function () { if (dirty) { clearTimeout(pushTimer); doPush(); } else syncPull(); });
    $("syncLink").addEventListener("click", function () {
      var url = location.origin + location.pathname + "?sync=" +
        encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(sync)))));
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () { $("syncNote").textContent = "コピーしました。もう一方の端末で開いてください。"; });
      } else { prompt("このURLをもう一方の端末で開いてください", url); }
    });
    $("syncOff").addEventListener("click", function () {
      if (!confirm("この端末の同期を解除します。消した記録自体は残ります。")) return;
      sync = null;
      try { localStorage.removeItem(SKEY); } catch (e) { /* ignore */ }
      clearInterval(pollTimer);
      renderSyncUI();
    });
  }

  function afterSync() { refresh(); }

  // ---------- 絞り込みと描画 ----------
  function bands() {
    var on = {};
    Array.prototype.forEach.call(document.querySelectorAll(".cov"), function (c) { if (c.checked) on[Number(c.value)] = 1; });
    return on;
  }

  function passes(o, on, minLen, ctg, mi) {
    if (isDone(o.id) && !$("showdone").checked) return false;
    if (!on[o.band]) return false;
    if (o.len < minLen) return false;
    if (ctg !== "" && o.ctg !== Number(ctg)) return false;
    if (mi !== "" && o.ms.indexOf(Number(mi)) < 0) return false;
    return true;
  }

  function refresh() {
    var dkm = 0, rest = 0;
    for (var i = 0; i < roads.length; i++) {
      if (isDone(roads[i].id)) dkm += roads[i].len; else rest++;
    }
    $("pRest").textContent = num(rest);
    $("pGone").textContent = num(doneN);
    $("gN").textContent = num(doneN);
    $("gKm").textContent = (dkm / 1000).toFixed(1);
    $("gRest").textContent = num(rest);
    draw();
    renderNear();
  }

  function getLine() {
    var pl = pool.pop();
    if (!pl) {
      pl = new google.maps.Polyline({ clickable: true });
      pl.addListener("click", function () {
        if (!pl._o) return;
        if (eraser) mark([pl._o.id], !isDone(pl._o.id));
        else select(pl._o);
      });
    }
    return pl;
  }

  function draw() {
    if (!map) return;
    var b = map.getBounds();
    if (!b) return;
    var sw = b.getSouthWest(), ne = b.getNorthEast();
    var s = sw.lat(), w = sw.lng(), n = ne.lat(), e = ne.lng();
    var on = bands(), minLen = Number($("flen").value), ctg = $("fctg").value, mi = $("fmuni").value;
    var seen = {}, hits = [];
    for (var y = Math.floor(s / GS); y <= Math.floor(n / GS); y++) {
      for (var x = Math.floor(w / GS); x <= Math.floor(e / GS); x++) {
        var cell = grid[y + ":" + x];
        if (!cell) continue;
        for (var i = 0; i < cell.length; i++) {
          var idx = cell[i];
          if (seen[idx]) continue;
          seen[idx] = 1;
          var o = roads[idx];
          if (o.b[0] > n || o.b[2] < s || o.b[1] > e || o.b[3] < w) continue;
          if (!passes(o, on, minLen, ctg, mi)) continue;
          hits.push(o);
        }
      }
    }
    hits.sort(function (a, b2) { return b2.len - a.len; });
    inView = hits;
    if (hits.length > CAP) hits = hits.slice(0, CAP);
    drawn.forEach(function (pl) { pl.setMap(null); pl._o = null; pool.push(pl); });
    drawn = [];
    var z = map.getZoom();
    hits.forEach(function (o) {
      var pl = getLine(), dn = isDone(o.id);
      pl._o = o;
      pl.setOptions({
        path: o.pts.map(function (c) { return { lat: c[1], lng: c[0] }; }),
        strokeColor: dn ? DONE_C : COLORS[o.band],
        strokeWeight: dn ? 3 : (z >= 16 ? 8 : (z >= 14 ? 6 : 3.5)),
        strokeOpacity: dn ? .45 : (o.band === 0 ? .95 : .8),
        zIndex: dn ? 1 : 10 - o.band
      });
      pl.setMap(map);
      drawn.push(pl);
    });
  }

  function select(o) {
    sel = o;
    var d = isDone(o.id);
    $("aTtl").textContent = (D.ctgs[o.ctg] || "道路").replace("市区町村道等", "市町村道") + "　" +
      (o.len >= 1000 ? (o.len / 1000).toFixed(1) + "km" : o.len + "m");
    $("aSub").textContent = o.ms.map(function (i) { return D.munis[i]; }).join("・") +
      " ／ " + (D.widths[o.wd] || "") + " ／ 公式SV " + Math.round(o.cov * 100) + "%";
    $("aDone").textContent = d ? "消したのを戻す" : "行った（消す）";
    $("aDone").className = "bigbtn" + (d ? " undoish" : "");
    $("action").hidden = false;
  }

  // ---------- ドラッグで四角く囲って消す ----------
  var rectMode = false;

  function setRectMode(on) {
    rectMode = on;
    $("btnRect").classList.toggle("on", on);
    document.body.classList.toggle("rectmode", on);
    if (map) map.setOptions({ draggable: !on });
    if (!on) $("rectbox").hidden = true;
    if (on && eraser) {   // 消しゴムモードとは同時に使わない
      eraser = false;
      $("btnEraser").classList.remove("on");
    }
  }

  // 画面上の座標 → 緯度経度
  function pointToLatLng(x, y) {
    var proj = map.getProjection();
    if (!proj) return null;
    var r = $("map").getBoundingClientRect();
    var scale = Math.pow(2, map.getZoom());
    var cw = proj.fromLatLngToPoint(map.getCenter());
    return proj.fromPointToLatLng(new google.maps.Point(
      cw.x + (x - r.left - r.width / 2) / scale,
      cw.y + (y - r.top - r.height / 2) / scale));
  }

  function roadsInBox(s, w, n, e) {
    var on = bands(), minLen = Number($("flen").value), ctg = $("fctg").value, mi = $("fmuni").value;
    var out = [], seen = {};
    for (var y = Math.floor(s / GS); y <= Math.floor(n / GS); y++) {
      for (var x = Math.floor(w / GS); x <= Math.floor(e / GS); x++) {
        var cell = grid[y + ":" + x];
        if (!cell) continue;
        for (var i = 0; i < cell.length; i++) {
          var idx = cell[i];
          if (seen[idx]) continue;
          seen[idx] = 1;
          var o = roads[idx];
          if (o.b[0] > n || o.b[2] < s || o.b[1] > e || o.b[3] < w) continue;
          if (isDone(o.id)) continue;
          if (!passes(o, on, minLen, ctg, mi)) continue;
          for (var k = 0; k < o.pts.length; k++) {      // 1点でも枠の中に入っていれば対象
            var p = o.pts[k];
            if (p[1] >= s && p[1] <= n && p[0] >= w && p[0] <= e) { out.push(o); break; }
          }
        }
      }
    }
    return out;
  }

  function setupRectSelect() {
    var el = $("map"), box = $("rectbox");
    var x0 = 0, y0 = 0, drawing = false;

    function geom(x1, y1) {
      return { l: Math.min(x0, x1), t: Math.min(y0, y1),
               w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
    }

    function down(e) {
      if (!rectMode || e.button > 0) return;
      drawing = true;
      x0 = e.clientX; y0 = e.clientY;
      box.hidden = false;
      box.style.left = x0 + "px"; box.style.top = y0 + "px";
      box.style.width = "0px"; box.style.height = "0px";
      $("rectn").textContent = "";
      el.setPointerCapture && e.pointerId !== undefined && el.setPointerCapture(e.pointerId);
      e.preventDefault(); e.stopPropagation();
    }

    function move(e) {
      if (!drawing) return;
      var g = geom(e.clientX, e.clientY);
      box.style.left = g.l + "px"; box.style.top = g.t + "px";
      box.style.width = g.w + "px"; box.style.height = g.h + "px";
      if (g.w > 20 && g.h > 20) {
        var a = pointToLatLng(g.l, g.t), b2 = pointToLatLng(g.l + g.w, g.t + g.h);
        if (a && b2) {
          var n = roadsInBox(Math.min(a.lat(), b2.lat()), Math.min(a.lng(), b2.lng()),
                             Math.max(a.lat(), b2.lat()), Math.max(a.lng(), b2.lng())).length;
          $("rectn").textContent = num(n) + " 本";
        }
      }
      e.preventDefault(); e.stopPropagation();
    }

    function up(e) {
      if (!drawing) return;
      drawing = false;
      box.hidden = true;
      var g = geom(e.clientX, e.clientY);
      e.preventDefault(); e.stopPropagation();
      if (g.w < 12 || g.h < 12) return;          // 小さすぎる＝ただのクリック
      var a = pointToLatLng(g.l, g.t), b2 = pointToLatLng(g.l + g.w, g.t + g.h);
      if (!a || !b2) return;
      var hit = roadsInBox(Math.min(a.lat(), b2.lat()), Math.min(a.lng(), b2.lng()),
                           Math.max(a.lat(), b2.lat()), Math.max(a.lng(), b2.lng()));
      if (!hit.length) { alert("囲った範囲に消せる道がありません。"); return; }
      var km = hit.reduce(function (t, o) { return t + o.len; }, 0) / 1000;
      if (confirm("囲った範囲の " + num(hit.length) + " 本（" + km.toFixed(1) + " km）を消します。よろしいですか？\n（「取り消し」で戻せます）")) {
        mark(hit.map(function (o) { return o.id; }), true);
      }
    }

    el.addEventListener("pointerdown", down, true);
    el.addEventListener("pointermove", move, true);
    el.addEventListener("pointerup", up, true);
    el.addEventListener("pointercancel", function () { drawing = false; box.hidden = true; }, true);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && rectMode) setRectMode(false);
    });
  }

  // ---------- 現在地 ----------
  function toggleFollow() {
    if (follow) {
      follow = false;
      $("btnLoc").classList.remove("on");
      if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      return;
    }
    if (!navigator.geolocation) { alert("この端末では現在地を使えません。"); return; }
    follow = true;
    $("btnLoc").classList.add("on");
    watchId = navigator.geolocation.watchPosition(function (p) {
      myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
      if (!meMarker) {
        meMarker = new google.maps.Marker({ map: map, zIndex: 999,
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: "#22527d",
                  fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3 } });
        meCircle = new google.maps.Circle({ map: map, strokeWeight: 0, fillColor: "#22527d", fillOpacity: .12, clickable: false });
      }
      meMarker.setPosition(myPos);
      meCircle.setCenter(myPos);
      meCircle.setRadius(Math.min(p.coords.accuracy || 30, 200));
      if (follow) {
        map.panTo(myPos);
        if (map.getZoom() < 15) map.setZoom(16);
      }
      renderNear();
    }, function (err) {
      follow = false;
      $("btnLoc").classList.remove("on");
      alert("現在地を取得できませんでした（" + (err && err.message || "") + "）。\n設定 → Safari → 位置情報 を確認してください。");
    }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }

  function dist(a, b) {
    var R = 6371000, p = Math.PI / 180;
    var dLat = (b.lat - a.lat) * p, dLng = (b.lng - a.lng) * p;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function renderNear() {
    var base = myPos || (map && map.getCenter() ? { lat: map.getCenter().lat(), lng: map.getCenter().lng() } : null);
    if (!base) return;
    var on = bands(), minLen = Number($("flen").value), ctg = $("fctg").value, mi = $("fmuni").value;
    var cand = [], seen = {};
    var R = 0.03;   // 約3km四方
    for (var y = Math.floor((base.lat - R) / GS); y <= Math.floor((base.lat + R) / GS); y++) {
      for (var x = Math.floor((base.lng - R * 1.3) / GS); x <= Math.floor((base.lng + R * 1.3) / GS); x++) {
        var cell = grid[y + ":" + x];
        if (!cell) continue;
        for (var i = 0; i < cell.length; i++) {
          var idx = cell[i];
          if (seen[idx]) continue;
          seen[idx] = 1;
          var o = roads[idx];
          if (!passes(o, on, minLen, ctg, mi)) continue;
          var m = o.pts[Math.floor(o.pts.length / 2)];
          cand.push([dist(base, { lat: m[1], lng: m[0] }), o]);
        }
      }
    }
    cand.sort(function (a, b) { return a[0] - b[0]; });
    cand = cand.slice(0, 40);
    var html = cand.map(function (c, i) {
      var o = c[1], d = c[0];
      return '<div class="row2" data-i="' + i + '">' +
        '<span class="dist">' + (d < 1000 ? Math.round(d) + "m" : (d / 1000).toFixed(1) + "km") + "</span>" +
        '<span class="mid"><span class="nm">' + esc((D.ctgs[o.ctg] || "").replace("市区町村道等", "市町村道")) +
        "　" + (o.len >= 1000 ? (o.len / 1000).toFixed(1) + "km" : o.len + "m") + "</span>" +
        '<span class="sub">' + esc(o.ms.map(function (k) { return D.munis[k]; }).join("・")) +
        " ／ " + esc(D.widths[o.wd] || "") + "</span></span>" +
        '<span class="chip c' + o.band + '">' + Math.round(o.cov * 100) + "%</span></div>";
    }).join("");
    $("pNear").innerHTML = html ||
      '<div class="set"><p class="note" style="margin:0">この3km以内に該当する道がありません。地図を動かすか、絞り込みを緩めてください。</p></div>';
    $("pNear").onclick = function (ev) {
      var row = ev.target.closest ? ev.target.closest(".row2") : null;
      if (!row) return;
      var o = cand[Number(row.getAttribute("data-i"))][1];
      var m = o.pts[Math.floor(o.pts.length / 2)];
      follow = false;
      $("btnLoc").classList.remove("on");
      map.panTo({ lat: m[1], lng: m[0] });
      map.setZoom(17);
      select(o);
      if (!$("sheet").classList.contains("closed")) toggleSheet();
    };
  }

  function toggleSheet() { $("sheet").classList.toggle("closed"); }
})();
</script>
</body>
</html>
